name: Steam Deck build

# Builds the Flatpak bundle (same app id as the Flathub version, so it replaces it) and publishes it
# together with the update script as a GitHub release. Run on every push to the `deck` branch.
on:
  push:
    branches:
      - deck
  workflow_dispatch:

permissions:
  contents: write

env:
  node_version: 24

jobs:
  cachedeps:
    name: "Generate cached sources"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'flatpak/flatpak-builder-tools'

      - name: Install Python deps
        run: pip3 install --only-binary :all: aiohttp==3.14.5 toml==0.10.2

      - name: Install flatpak-builder-tools
        run: pipx install ./node/

      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Prep artifacts dir
        run: mkdir ./deps-dist/

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node_version }}

      - name: Install yarn dependencies
        run: yarn install --ignore-scripts

      - name: Build yarn cache
        run: flatpak-node-generator yarn yarn.lock -o ./deps-dist/yarn-sources.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-sources
          path: ./deps-dist/

  flatpak:
    name: "Flatpak build"
    runs-on: ubuntu-latest
    needs: [cachedeps]

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-sources
          path: packages/desktop/flatpak/

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node_version }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: greenlight.flatpak
          manifest-path: packages/desktop/flatpak/io.github.unknownskl.greenlight.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Prepare release files
        run: |
          sha256sum greenlight.flatpak > greenlight.flatpak.sha256
          cp packages/desktop/flatpak/update-greenlight.sh update-greenlight.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: greenlight-flatpak
          path: |
            greenlight.flatpak
            greenlight.flatpak.sha256
            update-greenlight.sh

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: deck-${{ github.run_number }}
          name: Steam Deck build ${{ github.run_number }}
          make_latest: true
          body: |
            Greenlight for Steam Deck (Flatpak, app id `io.github.unknownskl.greenlight`).

            Update an existing install (settings and login are kept) - run in Konsole on the Steam Deck:

            ```
            curl -fsSL --proto '=https' --tlsv1.2 https://github.com/${{ github.repository }}/releases/latest/download/update-greenlight.sh | bash
            ```

            What is different and how it works: https://github.com/${{ github.repository }}/blob/deck/DECK.md
          files: |
            greenlight.flatpak
            greenlight.flatpak.sha256
            update-greenlight.sh
